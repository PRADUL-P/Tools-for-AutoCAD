name: Publish LISP Release Assets

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package and Release Published LISPs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Individual Downloadable LISP Files & Zips
        run: |
          mkdir -p release-assets
          
          # Copy each published LISP into release-assets with clean filenames
          cp "LISP/Published/ATTFIX/ATTFIX.lsp" "release-assets/ATTFIX.lsp"
          cp "LISP/Published/BLOCK_RENAMER/BLOCK_RENAMER.lsp" "release-assets/BLOCK_RENAMER.lsp"
          cp "LISP/Published/Create Similar/CREATE SIMILAR.LSP" "release-assets/CREATE_SIMILAR.lsp"
          cp "LISP/Published/HIDE_SHOW/HIDE_SHOW.LSP" "release-assets/HIDE_SHOW.lsp"
          cp "LISP/Published/MTEXT_TO_ATTR/MTEXT2ATTR.lsp" "release-assets/MTEXT2ATTR.lsp"
          cp "LISP/Published/SELECTION/Selection.lsp" "release-assets/Selection.lsp"
          cp "LISP/Published/TCOUNT_PLUS/TCOUNT_PLUS.lsp" "release-assets/TCOUNT_PLUS.lsp"
          cp "LISP/Published/XLINE/XLINE_ALL.lsp" "release-assets/XLINE_ALL.lsp"

          # Copy individual zip packages
          if [ -d "Downloads" ]; then
            cp Downloads/*.zip release-assets/
          fi

          echo "Prepared release assets:"
          ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "AutoCAD LISP Tools v1.0.0 (Published & Tested)"
          body: |
            ## 🚀 Production-Ready AutoCAD LISP Tools

            Click any of the `.zip` or `.lsp` assets below to download directly to your computer!

            ### 📦 Individual Tools:
            - **ATTFIX** (`AF`, `ATTFIX`) — Instant Attribute Value, Tag & Prompt synchronizer
            - **BLOCK_RENAMER** (`BRN`, `BNAME`) — On-screen & batch block renamer
            - **MTEXT2ATTR** (`M2A`, `MT2ATT`) — In-place Text/MText to ATTDEF conversion
            - **TCOUNT_PLUS** (`TC`, `TCOUNTPLUS`) — Advanced directional renumbering
            - **XLINE_ALL** (`XVN`, `XHN`, `XH`, `XV`) — Multi-spaced construction lines
            - **Selection** (`SA`, `SAT`, `SAL`, etc.) — Fast object selection helpers
            - **HIDE_SHOW** (`HH`, `IL`, `HR`) — Hide/Isolate/Restore visibility
            - **CREATE_SIMILAR** (`CS`) — Create matching element properties

            ### 🗂️ All-in-One:
            - **All-Published-LISP-Tools.zip** — All published `.lsp` tools in one bundle.
          files: release-assets/*
          draft: false
          prerelease: false
