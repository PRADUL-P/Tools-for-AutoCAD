name: Publish LISP Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package and Release Published LISPs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Individual Downloadable LISP Files
        run: |
          mkdir -p release-assets
          
          # Copy each published LISP into release-assets with clean filenames
          cp "LISP/Published/ATTFIX/ATTFIX.lsp" "release-assets/ATTFIX.lsp"
          cp "LISP/Published/BLOCK_RENAMER/BLOCK_RENAMER.lsp" "release-assets/BLOCK_RENAMER.lsp"
          cp "LISP/Published/Create Similar/CREATE SIMILAR.LSP" "release-assets/CREATE_SIMILAR.lsp"
          cp "LISP/Published/HIDE_SHOW/HIDE_SHOW.LSP" "release-assets/HIDE_SHOW.lsp"
          cp "LISP/Published/MTEXT_TO_ATTR/MTEXT2ATTR.lsp" "release-assets/MTEXT2ATTR.lsp"
          cp "LISP/Published/SELECTION/Selection.lsp" "release-assets/Selection.lsp"
          cp "LISP/Published/TCOUNT_PLUS/TCOUNT_PLUS.lsp" "release-assets/TCOUNT_PLUS.lsp"
          cp "LISP/Published/XLINE/XLINE_ALL.lsp" "release-assets/XLINE_ALL.lsp"

          # Create an all-in-one bundle zip containing all published tools
          cd release-assets
          zip -9 All-Published-LISP-Tools.zip *.lsp
          cd ..

          echo "Prepared release assets:"
          ls -la release-assets

      - name: Determine Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "AutoCAD LISP Tools ${{ steps.get_tag.outputs.tag }}"
          body: |
            ## 🚀 Production-Ready AutoCAD LISP Tools

            Download individual `.lsp` files below or grab the complete bundle:

            ### 📦 Individual Tools (Click to Download):
            - [📥 **ATTFIX.lsp**](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_tag.outputs.tag }}/ATTFIX.lsp) — Instant Attribute Value, Tag & Prompt synchronizer (`AF`, `ATTFIX`)
            - [📥 **BLOCK_RENAMER.lsp**](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_tag.outputs.tag }}/BLOCK_RENAMER.lsp) — On-screen & batch block renamer (`BRN`, `BNAME`)
            - [📥 **MTEXT2ATTR.lsp**](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_tag.outputs.tag }}/MTEXT2ATTR.lsp) — In-place Text/MText to ATTDEF conversion (`M2A`, `MT2ATT`)
            - [📥 **TCOUNT_PLUS.lsp**](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_tag.outputs.tag }}/TCOUNT_PLUS.lsp) — Advanced directional renumbering (`TC`, `TCOUNTPLUS`)
            - [📥 **XLINE_ALL.lsp**](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_tag.outputs.tag }}/XLINE_ALL.lsp) — Multi-spaced construction lines (`XVN`, `XHN`, `XH`, `XV`)
            - [📥 **Selection.lsp**](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_tag.outputs.tag }}/Selection.lsp) — Fast object selection helpers (`SA`, `SAT`, `SAL`, etc.)
            - [📥 **HIDE_SHOW.lsp**](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_tag.outputs.tag }}/HIDE_SHOW.lsp) — Hide/Isolate/Restore visibility (`HH`, `IL`, `HR`)
            - [📥 **CREATE_SIMILAR.lsp**](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_tag.outputs.tag }}/CREATE_SIMILAR.lsp) — Create matching element properties (`CS`)

            ### 🗂️ Complete Bundle:
            - [📦 **All-Published-LISP-Tools.zip**](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_tag.outputs.tag }}/All-Published-LISP-Tools.zip) — Contains all published `.lsp` tools in one download.
          files: release-assets/*
          draft: false
          prerelease: false
